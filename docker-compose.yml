services:
  library:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - library-data:/data
    command: ["/web", "-data-dir", "/data", "-notifier-url", "http://notifier:8081"]

  notifier:
    build:
      context: .
      dockerfile: Dockerfile.notifier
    ports:
      - "8081:8081"
    volumes:
      - notifier-data:/data
    environment:
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
    command:
      - "/notifier"
      - "-data-dir=/data"
      - "-library-url=http://library:3000"
      - "-smtp-host=${SMTP_HOST}"
      - "-smtp-from=${SMTP_FROM}"
      - "-smtp-user=${SMTP_USER}"
      - "-check-interval=1h"
    depends_on:
      - library

volumes:
  library-data:
  notifier-data:
