<form hx-post="/watchlist/subscribe"
      hx-target="this"
      hx-swap="outerHTML"
      class="mt-3 flex flex-col gap-2">
    <input type="hidden" name="title"    value="{{ .Title }}">
    <input type="hidden" name="type"     value="{{ .Type }}">
    <input type="hidden" name="platform" value="{{ .Platform }}">
    <label class="text-xs text-slate-500">E-Mail-Adresse für Benachrichtigung:</label>
    <div class="flex gap-2">
        <input type="email"
               name="email"
               required
               placeholder="beispiel@mail.de"
               class="flex-1 text-sm border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-slate-300">
        <button type="submit"
                class="px-3 py-1.5 text-sm bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition-colors">
            Speichern
        </button>
    </div>
</form>
